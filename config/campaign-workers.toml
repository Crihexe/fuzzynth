schema_version = 1

[context]
max_context_bytes = 131072
max_feedback_bytes = 4096
dataset_enabled = true
dataset_root = ".local/datasets/v8_js_pocs_preview_v3/javascript_corpus"
dataset_window_policy = "random_per_session"

[[workers]]
id = "spark-custom-iterative-js-rich"
enabled = false
provider = "alternate"
model = "gpt-5.3-codex-spark"
meter = "spark_alternate"
mode = "iterative_raw_js"
prompt = "prompts/iterative_js_v1.txt"
prompt_variant = "rich"
corpus_pair_id = "spark-custom-iterative-js-v3-preview"
reasoning_efforts = ["none"]
verbosity = "high"
temperatures = []
min_turns_per_session = 8
max_turns_per_session = 16
history_turns = 6
max_output_tokens = 4096
reservation_output_tokens = 0
v8_build_profile = "release_symbolized"
v8_worker_profile = "standard"
d8_flags = ["--allow-natives-syntax", "--expose-gc", "--fuzzing"]

[[workers]]
id = "spark-custom-iterative-js-lean"
enabled = false
provider = "alternate"
model = "gpt-5.3-codex-spark"
