schema_version = 2

[gate]
bounded_campaigns_enabled = true
unknown_usage_policy = "reserve_worst_case_and_pause"
automatic_budget_reset = false

[request_caps]
# Custom generations use SSE and this remains the maximum period without socket
# progress. The supervisor remains interruptible and every worst-case budget
# reservation happens before dispatch.
wall_seconds = 300
# Raw SSE includes event framing and reasoning payloads; keep enough room for a
# full custom response while retaining the separate 512 KiB executable cap.
max_response_bytes = 16777216
max_program_bytes = 524288
max_feedback_bytes = 4096
max_context_bytes = 131072

# Spark is unmetered for the owner-provided custom subscription. Usage is still
# recorded. Quota failures pause only its worker and trigger an alert.
[meters.spark_alternate]
unit = "unmetered"
metered = false

# Owner-provided custom billing in credits per million tokens. Observed Responses
# usage includes reasoning inside output_tokens, so reasoning is not added twice.
# These cumulative caps never reset automatically.
[meters.luna_alternate]
unit = "credit"
metered = true
input_per_million = "5"
cached_input_per_million = "0.5"
output_per_million = "30"
hard_total_microunits = 1250000000
hard_uncached_input_tokens = 250000000
hard_cached_input_tokens = 2500000000
hard_output_tokens = 42000000
historical_reserve_microunits = 1000000

# Official GPT-5.6 Luna rates from OpenAI documentation on 2026-09-02. The local
# $4.90 cap leaves $0.10 beneath the owner's external $5 limit for earlier probes.
[meters.luna_official]
unit = "USD"
metered = true
input_per_million = "0.20"
cached_input_per_million = "0.02"
output_per_million = "1.20"
hard_total_microunits = 4900000

# Terra remains off until raw-worker baselines justify its 10x custom credit cost.
[meters.terra_alternate]
unit = "credit"
metered = true
enabled = false
