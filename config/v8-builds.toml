schema_version = 1

# Profiles are deliberately separate: throughput findings must be replayed on
# invariant- and memory-safety-oriented builds before triage.
[profiles.release_symbolized]
description = "Optimized throughput build with line-table symbols"
base_builder = "x64.release"
output_dir = "fuzzynth-x64.release-symbolized"
target = "d8"
extra_gn_args = [
  "symbol_level=1",
]

[profiles.optdebug]
description = "Optimized debug build with slow checks, backtraces, and full symbols"
base_builder = "x64.optdebug"
output_dir = "fuzzynth-x64.optdebug"
target = "d8"
extra_gn_args = []

[profiles.asan]
description = "Optimized AddressSanitizer build with symbols"
base_builder = "x64.release"
output_dir = "fuzzynth-x64.asan"
target = "d8"
extra_gn_args = [
  "is_asan=true",
  "symbol_level=1",
]

[profiles.ubsan]
description = "Optimized UndefinedBehaviorSanitizer build with vptr checks and fail-fast diagnostics"
base_builder = "x64.release"
output_dir = "fuzzynth-x64.ubsan"
target = "d8"
extra_gn_args = [
  "is_ubsan=true",
  "is_ubsan_no_recover=true",
  "is_ubsan_vptr=true",
  "symbol_level=1",
]

[profiles.tsan]
description = "Optimized ThreadSanitizer build for Worker and shared-memory races"
base_builder = "x64.release"
output_dir = "fuzzynth-x64.tsan"
target = "d8"
extra_gn_args = [
  "is_tsan=true",
  "symbol_level=1",
]
