schema_version = 2

[[providers]]
id = "alternate"
credential_key = "ALTERNATE_OPENAI_API_KEY"
credential_base_url = "ALTERNATE_OPENAI_BASE_URL"
temperature_policy = "omit"
transport = "sse_complete_before_execute"
unsupported_parameters = ["max_output_tokens", "max_completion_tokens", "temperature", "top_p"]

[[providers]]
id = "official"
credential_key = "OPENAI_API_KEY"
base_url_policy = "fixed_official"
temperature_policy = "supported"
transport = "json_complete_before_execute"

[[models]]
id = "spark-alternate"
provider = "alternate"
model = "gpt-5.3-codex-spark"
temperature = []
reasoning_effort = ["none"]
verbosity = ["high"]

[[models]]
id = "luna-alternate"
provider = "alternate"
model = "gpt-5.6-luna"
temperature = []
reasoning_effort = ["xhigh"]
verbosity = ["high"]

[[models]]
id = "gpt-4o-mini-official"
provider = "official"
model = "gpt-4o-mini"
temperature = [0.0, 0.5, 1.0, 1.5, 2.0]
reasoning_effort = []
verbosity = []

[[models]]
id = "gpt-4.1-nano-official"
provider = "official"
model = "gpt-4.1-nano"
deprecated = true
temperature = [0.0, 0.5, 1.0, 1.5, 2.0]
reasoning_effort = []
verbosity = []

[[models]]
id = "terra-alternate"
provider = "alternate"
model = "gpt-5.6-terra"
temperature = []
reasoning_effort = ["xhigh"]
verbosity = ["medium"]

[[campaigns]]
id = "spark-custom-iterative-js"
enabled = true
model = "spark-alternate"
mode = "iterative_complete_response"
format = "javascript"
prompt = "prompts/iterative_js_v1.txt"
turn_range = [8, 16]

[[campaigns]]
id = "luna-custom-xhigh-iterative-js"
enabled = true
model = "luna-alternate"
mode = "iterative_complete_response"
format = "javascript"
prompt = "prompts/iterative_js_v1.txt"
turn_range = [4, 8]

[[campaigns]]
id = "gpt-4o-mini-official-temperature-js"
enabled = true
model = "gpt-4o-mini-official"
mode = "iterative_non_streaming"
format = "javascript"
prompt = "prompts/iterative_js_v1.txt"
turn_range = [1, 3]

[[campaigns]]
id = "gpt-4.1-nano-official-temperature-js"
enabled = true
model = "gpt-4.1-nano-official"
mode = "iterative_non_streaming"
format = "javascript"
prompt = "prompts/iterative_js_v1.txt"
turn_range = [6, 6]

[[campaigns]]
id = "terra-custom-xhigh-tool-investigator"
enabled = false
model = "terra-alternate"
mode = "tool_investigator"
format = "javascript"
turn_range = [1, 1]

[context]
policies = ["short_randomized", "unconditioned_control"]
dataset_window_policy = "random_per_session"
archive_full_history = true
resend_full_history = false

[safety]
streaming_campaigns_enabled = true
live_campaign_cli_exposed = true
dataset_integration_required = true
hard_budget_required = true
crash_evidence_gate_required = true
automatic_replay_enabled = false
