schema_version = 2

[[providers]]
id = "alternate"
credential_key = "ALTERNATE_OPENAI_API_KEY"
credential_base_url = "ALTERNATE_OPENAI_BASE_URL"
temperature_policy = "omit"

[[providers]]
id = "official"
credential_key = "OPENAI_API_KEY"
base_url_policy = "fixed_official"
temperature_policy = "supported"

[[models]]
id = "spark-alternate"
provider = "alternate"
model = "gpt-5.3-codex-spark"
temperature = []
reasoning_effort = ["none"]
verbosity = ["high"]

[[models]]
id = "luna-alternate"
provider = "alternate"
model = "gpt-5.6-luna"
temperature = []
reasoning_effort = ["xhigh"]
verbosity = ["high"]

[[models]]
id = "luna-official"
provider = "official"
model = "gpt-5.6-luna"
temperature = [1.2, 1.5, 1.8]
reasoning_effort = ["none", "low"]
verbosity = ["high"]

[[models]]
id = "terra-alternate"
provider = "alternate"
model = "gpt-5.6-terra"
temperature = []
reasoning_effort = ["xhigh"]
verbosity = ["medium"]

[[campaigns]]
id = "spark-custom-iterative-js"
enabled = true
model = "spark-alternate"
mode = "iterative_non_streaming"
format = "javascript"
prompt = "prompts/iterative_js_v1.txt"
turn_range = [8, 16]

[[campaigns]]
id = "luna-custom-xhigh-iterative-js"
enabled = true
model = "luna-alternate"
mode = "iterative_non_streaming"
format = "javascript"
prompt = "prompts/iterative_js_v1.txt"
turn_range = [4, 8]

[[campaigns]]
id = "luna-official-high-temperature-js"
enabled = true
model = "luna-official"
mode = "iterative_non_streaming"
format = "javascript"
prompt = "prompts/iterative_js_v1.txt"
turn_range = [4, 8]

[[campaigns]]
id = "terra-custom-xhigh-tool-investigator"
enabled = false
model = "terra-alternate"
mode = "tool_investigator"
format = "javascript"
turn_range = [1, 1]

[context]
policies = ["short_randomized", "unconditioned_control"]
dataset_window_policy = "random_per_session"
archive_full_history = true
resend_full_history = false

[safety]
streaming_campaigns_enabled = false
live_campaign_cli_exposed = false
dataset_integration_required = true
hard_budget_required = true
crash_evidence_gate_required = true
automatic_replay_enabled = false
