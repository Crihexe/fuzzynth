schema_version = 1

[[providers]]
id = "alternate"
credential_key = "ALTERNATE_OPENAI_API_KEY"
credential_base_url = "ALTERNATE_OPENAI_BASE_URL"
temperature_policy = "omit"

[[providers]]
id = "official"
credential_key = "OPENAI_API_KEY"
base_url_policy = "fixed_official"
temperature_policy = "supported"

[[models]]
id = "spark-alternate"
provider = "alternate"
model = "gpt-5.3-codex-spark"
temperature = []
reasoning_effort_probe = ["none", "low"]
verbosity_probe = ["low", "medium", "high"]

[[models]]
id = "luna-alternate"
provider = "alternate"
model = "gpt-5.6-luna"
temperature = []
reasoning_effort_probe = ["none", "low", "medium"]
verbosity_probe = ["low", "medium", "high"]

[[models]]
id = "luna-official"
provider = "official"
model = "gpt-5.6-luna"
temperature = [0.4, 0.8, 1.0, 1.3]
reasoning_effort_probe = ["none", "low", "medium"]
verbosity_probe = ["low", "medium", "high"]

[[campaigns]]
id = "raw-js-spark-fresh"
enabled = false
model = "spark-alternate"
mode = "sealed_response"
format = "javascript"
prompt = "prompts/raw_js_v1.txt"
context_policy = "fresh"

[[campaigns]]
id = "raw-js-luna-stateful"
enabled = false
model = "luna-alternate"
mode = "sealed_response"
format = "javascript"
prompt = "prompts/raw_js_v1.txt"
context_policy = "adaptive"

[[campaigns]]
id = "raw-wasm-spark-rotating"
enabled = false
model = "spark-alternate"
mode = "sealed_response"
format = "javascript_wasm_transport"
prompt = "prompts/raw_wasm_v1.txt"
context_policy = "short"

[[campaigns]]
id = "raw-js-luna-official-temperature"
enabled = false
model = "luna-official"
mode = "sealed_response"
format = "javascript"
prompt = "prompts/raw_js_v1.txt"
context_policy = "fresh"

[context]
policies = ["fresh", "short", "medium", "long", "adaptive"]
dataset_window_policy = "randomized_versioned"
archive_full_history = true
resend_full_history = false

[safety]
unbounded_campaigns_enabled = false
hard_budget_required = true
crash_evidence_gate_required = true
