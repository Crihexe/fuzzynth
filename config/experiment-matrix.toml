schema_version = 1

[[providers]]
id = "alternate"
credential_key = "ALTERNATE_OPENAI_API_KEY"
credential_base_url = "ALTERNATE_OPENAI_BASE_URL"
temperature_policy = "omit"

[[providers]]
id = "official"
credential_key = "OPENAI_API_KEY"
base_url_policy = "fixed_official"
temperature_policy = "supported"

[[models]]
id = "spark-alternate"
provider = "alternate"
model = "gpt-5.3-codex-spark"
temperature = []
reasoning_effort_probe = ["none", "low"]
verbosity_probe = ["low", "medium", "high"]

[[models]]
id = "luna-alternate"
provider = "alternate"
model = "gpt-5.6-luna"
temperature = []
reasoning_effort_probe = ["none", "low", "medium"]
verbosity_probe = ["low", "medium", "high"]

[[models]]
id = "luna-official"
provider = "official"
model = "gpt-5.6-luna"
temperature = [0.4, 0.8, 1.0, 1.3]
reasoning_effort_probe = ["none", "low", "medium"]
verbosity_probe = ["low", "medium", "high"]

[context]
policies = ["fresh", "short", "medium", "long", "adaptive"]
dataset_window_policy = "randomized_versioned"
archive_full_history = true
resend_full_history = false

[safety]
unbounded_campaigns_enabled = false
hard_budget_required = true
crash_evidence_gate_required = true
